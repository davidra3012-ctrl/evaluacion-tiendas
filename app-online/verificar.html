<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#84cc16">
<link rel="icon" href="icon-192.png">
<title>Verificación de evaluación · Gestión Tiendas</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f2ef;color:#222}
header{background:#84cc16;color:#132205;padding:16px 18px;padding-top:calc(16px + env(safe-area-inset-top))}
header b{font-size:22px;font-weight:800;text-transform:lowercase;letter-spacing:.5px}
header div{font-size:13px;opacity:.9}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.07);margin-bottom:12px}
.ok{display:flex;align-items:center;gap:12px}
.ok .i{width:46px;height:46px;border-radius:50%;background:#1f9d55;color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;flex:none}
.ok h1{font-size:18px;margin:0}.ok p{margin:2px 0 0;color:#666;font-size:13px}
.nota{text-align:center;font-size:52px;font-weight:800;color:#d9731a;margin:4px 0 0}
.nl{text-align:center;color:#666;font-size:13px;margin-bottom:6px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #eee;font-size:15px}
.row:first-child{border-top:0}.row span{color:#777}.row b{text-align:right}
.btn{display:block;text-align:center;background:#84cc16;color:#132205;text-decoration:none;font-weight:700;padding:14px;border-radius:12px;margin-top:10px}
.err{color:#d64545}
.foot{text-align:center;color:#999;font-size:12px;margin:10px 0 30px}
</style>
</head>
<body>
<header><b>Gestión Tiendas</b><div>Verificación de evaluación de tienda</div></header>
<main id="m"></main>
<script>
(function(){
  const pad=n=>String(n).padStart(2,'0');
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const M=document.getElementById('m');
  let d=null;
  try{
    let h=location.hash.slice(1).replace(/-/g,'+').replace(/_/g,'/');while(h.length%4)h+='=';
    const bin=atob(h);const b=new Uint8Array([...bin].map(c=>c.charCodeAt(0)));
    d=JSON.parse(new TextDecoder().decode(b));
  }catch(e){}
  if(!d||!d.id||!d.f){M.innerHTML='<div class="card"><h2 class="err">Código no válido</h2><p>Este enlace no contiene una evaluación válida.</p></div>';return}
  const f=new Date(d.f);
  const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const fecha=`${DIAS[f.getDay()]} ${pad(f.getDate())}/${pad(f.getMonth()+1)}/${f.getFullYear()}`;
  const hora=`${pad(f.getHours())}:${pad(f.getMinutes())}:${pad(f.getSeconds())}`;
  const tieneU=d.la!=null&&d.lo!=null;
  function mapa(lat,lon){const z=17,n=2**z,w=Math.min(520,innerWidth-60),h=200;
    const xt=(lon+180)/360*n,lr=lat*Math.PI/180,yt=(1-Math.log(Math.tan(lr)+1/Math.cos(lr))/Math.PI)/2*n;
    const tx=Math.floor(xt),ty=Math.floor(yt),px=(xt-tx)*256,py=(yt-ty)*256;let im='';
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)im+=`<img src="https://tile.openstreetmap.org/${z}/${tx+dx}/${ty+dy}.png" style="position:absolute;left:${(dx+1)*256}px;top:${(dy+1)*256}px;width:256px;height:256px" alt="">`;
    return `<div style="position:relative;width:100%;height:${h}px;overflow:hidden;border-radius:12px;margin-top:10px;background:#eee"><div style="position:absolute;left:calc(50% - ${256+px}px);top:${h/2-256-py}px;width:768px;height:768px">${im}</div><div style="position:absolute;left:calc(50% - 12px);top:${h/2-30}px;font-size:30px">📍</div><div style="position:absolute;right:4px;bottom:2px;font-size:10px;background:rgba(255,255,255,.8);padding:0 3px">© OpenStreetMap</div></div>`}
  if(d.k==='p'){
    const DI=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],ff=new Date(d.f+'T12:00');
    const row=(k,v)=>`<div class="row"><span>${k}</span><b>${v}</b></div>`;
    const nom=k=>{const j=+k.slice(1),c=(d.c||[])[j]||('corte '+(j+1));return (k[0]==='m'?'Metas ':'Venta real ')+c};
    const R=(d.r||[]);const ok=R.filter(x=>x[2]).length;const g=R.find(x=>x.length>3);
    document.querySelector('header div').textContent='Verificación de pare técnico';document.title='Verificación de pare técnico · Gestión Tiendas';
    M.innerHTML=`<div class="card ok"><div class="i">✓</div><div><h1>Pare técnico registrado</h1><p>Datos leídos del código QR de la hoja.</p></div></div>
    <div class="card"><div class="nota">${d.n==null?'—':esc(d.n)+'%'}</div><div class="nl">Venta vs. meta final</div>
      ${row('Tienda',esc(d.t))}${row('Fecha',DI[ff.getDay()]+' '+pad(ff.getDate())+'/'+pad(ff.getMonth()+1)+'/'+ff.getFullYear())}${row('Registrado por',esc(d.v||'-'))}${row('Vendedores que cumplieron',esc(d.vc))}</div>
    <div class="card"><b>Hora de cada registro</b> <span style="color:#666;font-size:13px">· ${ok} de ${R.length} a tiempo</span>
      ${R.length?R.map(x=>row(esc(nom(x[0])),`${esc(x[1])} ${x[2]?'<span style="color:#1f9d55">✓ a tiempo</span>':'<span class="err">⚠️ fuera de hora</span>'}${x.length>3?`<br><a href="https://maps.google.com/?q=${encodeURIComponent(x[3]+','+x[4])}" target="_blank" rel="noopener" style="font-weight:400;font-size:13px">📍 ${esc(x[3])}, ${esc(x[4])} (±${esc(x[5])} m)</a>`:'<br><span class="err" style="font-weight:400;font-size:13px">sin GPS</span>'}`)).join(''):'<p class="err">Sin registros con hora.</p>'}
      ${g?mapa(+g[3],+g[4]):''}</div>
    <div class="foot">ID: ${esc(d.id)}</div>`;return}
  const row=(k,v)=>`<div class="row"><span>${k}</span><b>${v}</b></div>`;
  M.innerHTML=`
  <div class="card ok"><div class="i">✓</div><div><h1>${d.k==='c'?'Evaluación de colaborador':'Evaluación registrada'}</h1><p>Datos leídos del código QR del documento.</p></div></div>
  <div class="card"><div class="nota">${esc(d.n)}%</div><div class="nl">Calificación final</div>
    ${row('Tienda',esc(d.t))}${row(d.k==='c'?'Colaborador':'Evaluado',esc(d.e))}${d.s?row('Sección',esc(d.s)):''}${d.vt!=null?row('Cumplimiento de ventas',esc(d.vt)+'%'):''}${row('Evaluador',esc(d.v))}${row('Modalidad',esc(d.m||'-'))}
    ${d.a!=null?row('Técnicas de venta (anexo)',esc(d.a)+'% de 12%'):''}${d.c?row('Compromisos',esc(d.c)):''}</div>
  <div class="card">${row('Fecha',fecha)}${row('Hora exacta',hora)}
    ${tieneU?row('Ubicación GPS',`${esc(d.la)}, ${esc(d.lo)}`)+row('Precisión','± '+esc(d.p)+' m'):row('Ubicación GPS','<span class="err">No disponible</span>')}
    ${tieneU?mapa(+d.la,+d.lo):''}
    ${tieneU?`<a class="btn" href="https://maps.google.com/?q=${encodeURIComponent(d.la+','+d.lo)}" target="_blank" rel="noopener">📍 Ver ubicación en el mapa</a>`:''}</div>
  <div class="foot">ID: ${esc(d.id)}</div>`;
})();
</script>
</body>
</html>
